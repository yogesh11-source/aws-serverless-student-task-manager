<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            padding: 12px;
            width: 70%;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Student Task Manager</h1>

    <p>Manage your study tasks easily</p>

    <input type="text" id="task" placeholder="Enter your task">

    <button onclick="addTask()">Add Task</button>

    <p id="message"></p>

</div>

<script>

async function addTask() {

    const task = document.getElementById("task").value;

    if (task === "") {
        document.getElementById("message").innerText =
            "Please enter a task.";
        return;
    }

    try {

        const response = await fetch(
            "https://wecexnkfai.execute-api.us-east-1.amazonaws.com/tasks"
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    task: task
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
            document.getElementById("message").innerText =
                "✅ " + data.message;

            document.getElementById("task").value = "";
        } else {
            document.getElementById("message").innerText =
                "❌ " + (data.message || "Something went wrong");
        }

    } catch (error) {

        document.getElementById("message").innerText =
            "❌ Unable to connect to server.";

        console.error(error);
    }
}

</script>

</body>
</html>
